<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>나는 어떤 감자일까? — 감자 유형 테스트</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #3a2a20;
      --body: #1f1712;
      --muted: #332720;
      --paper: #fffdf7;
      --bg: #faf8f2;
      --green: #3d7d47;
      --green-dark: #32693b;
      --meadow: #e9f3df;
      --font-display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      --font-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-body);
      color: var(--ink);
      background: var(--bg);
      word-break: keep-all;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    h1, h2, h3, .font-display { font-family: var(--font-display); font-weight: 400; margin: 0; }
    button { font-family: inherit; cursor: pointer; }
    a { text-decoration: none; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(255, 253, 247, 0.94);
      backdrop-filter: blur(8px);
      border-bottom: 2px solid rgba(58, 42, 32, 0.15);
    }
    .topbar-inner {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 18px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .btn-home-top {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 12px;
      background: #faf6ec;
      border: 2px solid rgba(58, 42, 32, 0.3);
      color: var(--ink);
      font-family: var(--font-display);
      font-size: 15px;
    }
    .btn-home-top:hover { background: #efe7d5; border-color: var(--ink); }

    .container {
      flex: 1;
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 32px 18px 48px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .card {
      background: var(--paper);
      border: 2px solid var(--ink);
      border-radius: 28px;
      box-shadow: 0 6px 0 var(--ink);
      padding: 28px 24px;
    }
    @media (min-width: 640px) { .card { padding: 36px 40px; } }

    .pill {
      display: inline-flex;
      padding: 4px 14px;
      border-radius: 999px;
      background: var(--meadow);
      border: 1px solid rgba(61, 125, 71, 0.3);
      color: #2f6b38;
      font-size: 13px;
    }

    .intro-preview {
      margin: 24px 0;
      padding: 24px 14px;
      border-radius: 24px;
      background: #f4f8ec;
      border: 2px solid rgba(58, 42, 32, 0.14);
    }
    .intro-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      max-width: 560px;
      margin: 0 auto 14px;
      align-items: end;
    }
    .intro-item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .intro-thumb {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.3s ease, background 0.3s ease, border-color 0.3s ease;
      animation: pq-float 2.8s ease-in-out infinite;
    }
    @media (min-width: 640px) { .intro-thumb { width: 78px; height: 78px; } }
    .intro-thumb.active {
      transform: scale(1.08);
      background: var(--paper);
      border: 2px solid var(--ink);
      box-shadow: 0 3px 0 var(--ink);
    }
    .intro-thumb img { width: 100%; height: 100%; object-fit: contain; }
    .intro-label { font-family: var(--font-display); font-size: 13px; color: var(--muted); white-space: nowrap; }
    .intro-label.active { color: var(--green); }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 15px 24px;
      border-radius: 18px;
      background: var(--green);
      color: var(--paper);
      border: 2px solid var(--ink);
      box-shadow: 0 4px 0 var(--ink);
      font-family: var(--font-display);
      font-size: 19px;
      transition: transform 0.12s ease, background 0.15s ease;
    }
    .btn-primary:hover { background: var(--green-dark); }
    .btn-primary:active { transform: translateY(2px); }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 12px 16px;
      border-radius: 16px;
      background: var(--paper);
      color: var(--ink);
      border: 2px solid var(--ink);
      box-shadow: 0 3px 0 var(--ink);
      font-family: var(--font-display);
      font-size: 16px;
    }
    .btn-secondary:hover { background: #f5efe2; }

    .btn-subtle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 11px 12px;
      border-radius: 12px;
      background: var(--bg);
      color: var(--body);
      border: 1px solid rgba(58, 42, 32, 0.25);
      font-family: var(--font-display);
      font-size: 15px;
    }
    .btn-subtle:hover { background: #efe8d8; }

    .progress-card {
      background: var(--paper);
      border: 2px solid var(--ink);
      border-radius: 22px;
      box-shadow: 0 4px 0 var(--ink);
      padding: 16px 20px;
      margin-bottom: 20px;
    }
    .progress-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .track-wrap { position: relative; padding: 30px 14px 4px; }
    .track-potato {
      position: absolute;
      top: 0;
      transform: translateX(-50%);
      transition: left 0.3s ease-out;
      pointer-events: none;
    }
    .track-bar {
      height: 14px;
      border-radius: 999px;
      background: #e8dec9;
      border: 2px solid var(--ink);
      overflow: hidden;
    }
    .track-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #a67c52, #8b6239, #6cc070);
      transition: width 0.3s ease-out;
    }
    .track-dots { display: flex; justify-content: space-between; margin-top: 6px; padding: 0 2px; }
    .track-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(58, 42, 32, 0.2); }
    .track-dot.done { background: var(--green); }

    .choice-list { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
    .choice-btn {
      width: 100%;
      text-align: left;
      padding: 14px 16px;
      border-radius: 16px;
      background: var(--bg);
      border: 2px solid rgba(58, 42, 32, 0.24);
      box-shadow: 0 3px 0 rgba(58, 42, 32, 0.15);
      display: flex;
      align-items: flex-start;
      gap: 12px;
      color: var(--body);
      font-size: 16px;
      line-height: 1.5;
      transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease;
    }
    .choice-btn:hover { background: #f1f6e8; border-color: var(--ink); }
    .choice-btn.picked { background: #edf6e3; border-color: var(--green); box-shadow: 0 3px 0 var(--green); }
    .choice-btn.flash { background: var(--green); color: var(--paper); border-color: var(--ink); transform: translateY(2px); }
    .choice-num {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1px solid rgba(58, 42, 32, 0.3);
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-display);
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .result-medallion {
      width: 168px;
      height: 168px;
      margin: 14px auto 10px;
      border-radius: 28px;
      border: 2px solid rgba(58, 42, 32, 0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }
    .result-medallion img { width: 100%; height: 100%; object-fit: contain; animation: pq-result-pop 0.58s cubic-bezier(0.22, 1, 0.36, 1) forwards; }

    .traits-box {
      background: var(--bg);
      border: 2px solid rgba(58, 42, 32, 0.15);
      border-radius: 18px;
      padding: 18px 20px;
      margin: 20px 0 16px;
    }
    .traits-list { list-style: none; padding: 0; margin: 12px 0 0; display: flex; flex-direction: column; gap: 10px; }
    .traits-list li { display: flex; gap: 8px; font-size: 16px; line-height: 1.5; color: var(--body); }

    .partner-box {
      background: #f2f8ea;
      border: 2px solid rgba(61, 125, 71, 0.3);
      border-radius: 18px;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 20px;
    }
    .partner-thumb {
      width: 72px;
      height: 72px;
      border-radius: 16px;
      border: 2px solid rgba(58, 42, 32, 0.2);
      padding: 6px;
      flex-shrink: 0;
    }
    .partner-thumb img { width: 100%; height: 100%; object-fit: contain; }

    .grid-2 { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 10px; }
    @media (min-width: 520px) { .grid-2 { grid-template-columns: 1fr 1fr; } }
    .grid-2-always { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 60;
      background: var(--ink);
      color: var(--paper);
      font-family: var(--font-display);
      padding: 12px 20px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      display: none;
    }
    .toast.show { display: block; animation: pq-step-in 0.25s ease; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(58, 42, 32, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-backdrop.open { display: flex; }
    .modal-card {
      width: 100%;
      max-width: 640px;
      max-height: 85vh;
      overflow-y: auto;
      background: var(--paper);
      border: 2px solid var(--ink);
      border-radius: 26px;
      box-shadow: 0 8px 0 var(--ink);
      padding: 24px;
    }
    .dex-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px;
      border-radius: 16px;
      background: var(--bg);
      border: 2px solid rgba(58, 42, 32, 0.16);
      margin-top: 10px;
    }
    .dex-item.mine { background: #f2f9eb; border-color: var(--green); }
    .dex-img { width: 68px; height: 68px; border-radius: 14px; padding: 6px; border: 2px solid rgba(58, 42, 32, 0.18); flex-shrink: 0; }
    .dex-img img { width: 100%; height: 100%; object-fit: contain; }

    @keyframes pq-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes pq-dig-wobble {
      0%, 100% { transform: translateY(0) rotate(0); }
      25% { transform: translateY(-8px) rotate(-6deg); }
      55% { transform: translateY(2px) rotate(5deg); }
    }
    @keyframes pq-result-pop {
      0% { opacity: 0; transform: scale(0.65) translateY(16px); }
      60% { opacity: 1; transform: scale(1.07) translateY(-5px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes pq-step-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .step-in { animation: pq-step-in 0.28s ease; }
    .wobble { animation: pq-dig-wobble 0.65s ease-in-out infinite; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <button type="button" class="btn-home-top" id="btn-top-home">← 처음으로</button>
      <span class="font-display" style="color: var(--green); font-size: 18px;">감자 유형 테스트</span>
    </div>
  </header>

  <main class="container" id="app"></main>

  <div class="toast" id="toast" role="status" aria-live="polite">링크가 복사되었어요!</div>

  <div class="modal-backdrop" id="dex-modal" role="dialog" aria-modal="true" aria-label="5종 감자 도감">
    <div class="modal-card" id="dex-card"></div>
  </div>

  <script>
    // 이미지 기본 경로: 같은 폴더면 ".", public 하위면 "/public" 또는 "" 로 수정하세요.
    const IMAGE_BASE = "../public";
    const APP_LIVE_URL = "https://gamja-kiugi.vercel.app/";
    const ORDER = ["calm", "cheerful", "searching", "creative", "dependable"];
    const CIRCLED = ["①", "②", "③"];

    const RESULTS = {
      calm: {
        id: "calm", name: "차분한 감자", file: "calm%20potato.png",

        ],
        partnerId: "cheerful", partnerName: "활발한 감자", badgeBg: "#E9F3DF", stageBg: "#F1F7EA"
      },
      cheerful: {
        id: "cheerful", name: "활발한 감자", file: "cheerful%20potato.png",
        oneLiner: "에너지가 넘치고 사람들과 어울리는 걸 좋아하는 유형",
        traits: [
          "어색한 첫 조별과제 분위기를 5분 만에 녹임",
          "서포터즈·축제·대외활동 현장에서 에너지를 얻음",
          "사람들과 부딪히며 새로운 기회를 가장 먼저 발견함"
        ],
        partnerId: "calm", partnerName: "차분한 감자", badgeBg: "#FFF2CC", stageBg: "#FFF9E6"
      },
      searching: {
        id: "searching", name: "탐구하는 감자", file: "searching%20potato.png",
        oneLiner: "궁금한 걸 깊이 파고들고 새로운 지식을 찾는 유형",
        traits: [
          "관심 분야가 생기면 레퍼런스부터 끝까지 파고듦",
          "근거와 논리가 탄탄한 자료 조사 능력자",
          "숨겨진 공고나 알짜 정보를 남들보다 빠르게 찾아냄"
        ],
        partnerId: "creative", partnerName: "창의적인 감자", badgeBg: "#E6F1F8", stageBg: "#F1F7FB"
      },
      creative: {
        id: "creative", name: "창의적인 감자", file: "creative%20potato.png",
        oneLiner: "남다른 아이디어와 표현으로 새로운 걸 만드는 유형",
        traits: [
          "뻔한 과제 주제도 색다른 컨셉으로 뒤집어 버림",
          "발표 자료나 결과물에 자기만의 감각을 담아냄",
          "\"없으면 만들지 뭐!\" 실행력으로 새 프로젝트를 엶"
        ],
        partnerId: "dependable", partnerName: "든든한 감자", badgeBg: "#F1EBFF", stageBg: "#F7F3FF"
      },
      dependable: {
        id: "dependable", name: "든든한 감자", file: "dependable%20potato.png",
        oneLiner: "책임감 있고 꾸준하게 맡은 일을 해내는 유형",
        traits: [
          "마감일과 체크리스트는 절대 놓치지 않는 일정 마스터",
          "맡은 일은 끝까지 마무리해 팀원들의 신뢰 1순위",
          "학년별 할 일을 하나씩 채워 이력서를 완성하는 성실파"
        ],
        partnerId: "creative", partnerName: "창의적인 감자", badgeBg: "#F8ECD8", stageBg: "#FDF6EA"
      }
    };

    const QUESTIONS = [
      {
        id: 1, question: "새 학기 첫 조별과제 단톡방, 내가 가장 먼저 하는 행동은?",
        choices: [
          { text: "모두의 의견을 다 들어본 뒤 빠진 부분만 조용히 짚어준다", type: "calm" },
          { text: "\"안녕하세요!! 오늘 점심 같이 드실 분?\" 분위기부터 띄운다", type: "cheerful" },
          { text: "주제와 관련된 자료·레퍼런스 링크를 먼저 찾아 모아둔다", type: "searching" },
          { text: "남들 다 하는 뻔한 PPT 말고 색다른 발표 컨셉을 던져본다", type: "creative" },

        ]
      },
      {
        id: 2, question: "수업 사이 공강이 3시간이나 생겼다! 나의 선택은?",

          { text: "조용한 카페 구석에서 따뜻한 차 마시며 밀린 생각을 정리한다", type: "calm" },
          { text: "공강 겹치는 친구들한테 바로 연락해서 같이 밥 먹고 수다 떤다", type: "cheerful" },

          { text: "문득 떠오른 아이디어를 메모장이나 노트에 끄적이며 구상한다", type: "creative" },
          { text: "이번 주 할 일 목록을 꺼내서 과제 하나를 미리 끝내버린다", type: "dependable" }
        ]
      },
      {
        id: 3, question: "\"춘천에는 할 게 없다\"는 친구의 말에 내 속마음은?",
        choices: [
          { text: "'일단 내가 뭘 하고 싶은지부터 차근차근 정리해 봐야겠는데'", type: "calm" },
          { text: "'에이, 동아리나 축제 서포터즈 같이 해보면 재밌을 텐데!'", type: "cheerful" },
          { text: "'진짜 없나? 온라인이랑 지역 공고부터 싹 다 검색해 봐야지'", type: "searching" },
          { text: "'없으면 우리가 재밌는 프로젝트 하나 만들어 버리면 되지!'", type: "creative" },
          { text: "'지금 학년에 꼭 해야 할 것부터 하나씩 챙겨 두는 게 먼저야'", type: "dependable" }
        ]
      },
      {
        id: 4, question: "마음에 드는 공모전 공고를 발견했을 때 나는?",
        choices: [
          { text: "자격 요건, 심사 기준, 마감일까지 꼼꼼히 읽고 지원 여부를 결정한다", type: "calm" },
          { text: "같이 나갈 팀원부터 신나게 모집해서 브레인스토밍을 시작한다", type: "cheerful" },
          { text: "역대 수상작들을 전부 찾아보며 어떤 포인트가 먹히는지 분석한다", type: "searching" },
          { text: "공고 주제를 보자마자 머릿속에 떠오르는 독특한 기획안부터 적는다", type: "creative" },
          { text: "마감일까지 역산해서 주차별 작업 스케줄표부터 짠다", type: "dependable" }

      },
      {
        id: 5, question: "발표 하루 전, 갑자기 기획 일부를 수정해야 한다면?",
        choices: [
          { text: "당황하지 않고 침착하게 어디부터 고쳐야 안전할지 우선순위를 정한다", type: "calm" },
          { text: "\"우리 할 수 있어!\" 지친 팀원들 텐션을 끌어올리며 함께 해결한다", type: "cheerful" },
          { text: "왜 문제가 생겼는지 원인을 정확히 파악해서 논리적인 대안을 찾는다", type: "searching" },
          { text: "위기를 기회로 삼아 아예 더 임팩트 있는 반전 아이디어를 낸다", type: "creative" },
          { text: "밤을 새우더라도 맡은 파트는 완성도 있게 끝까지 책임지고 마감한다", type: "dependable" }
        ]
      },
      {
        id: 6, question: "축제 부스나 학과 행사를 준비할 때 맡고 싶은 역할은?",
        choices: [
          { text: "전체 동선과 안전, 예산 등을 꼼꼼하게 점검하는 운영 매니저", type: "calm" },
          { text: "부스 앞에서 지나가는 사람들 시선을 끄는 홍보·MC 담당", type: "cheerful" },
          { text: "사람들이 뭘 좋아하는지 사전 설문과 트렌드를 조사하는 리서처", type: "searching" },
          { text: "포스터, 굿즈, 부스 컨셉을 톡톡 튀게 꾸미는 아트·기획 디렉터", type: "creative" },
          { text: "물품 발주부터 당일 타임테이블까지 빈틈없이 챙기는 총괄 팀장", type: "dependable" }
        ]
      },
      {
        id: 7, question: "나만의 스펙과 이력서를 채워가는 스타일은?",
        choices: [
          { text: "남들 속도 신경 쓰지 않고 내 페이스로 신중하게 알짜배기만 고른다", type: "calm" },
          { text: "다양한 대외활동과 네트워킹으로 사람들과 부딪히며 경험을 쌓는다", type: "cheerful" },
          { text: "관심 직무와 전공 지식을 깊이 파서 전문성 있는 기록을 남긴다", type: "searching" },
          { text: "나만의 색깔이 드러나는 포트폴리오와 독창적인 결과물로 승부한다", type: "creative" },
          { text: "1학년부터 4학년까지 학년별 할 일을 빠짐없이 성실하게 쌓아간다", type: "dependable" }
        ]
      },
      {
        id: 8, question: "졸업할 때 내 감자가 어떤 모습이었으면 좋겠어?",
        choices: [
          { text: "흔들리지 않는 단단한 내면을 가진 여유로운 감자", type: "calm" },
          { text: "어디서든 사랑받고 좋은 인연이 가득한 인싸 감자", type: "cheerful" },
          { text: "자기 분야에 대해서라면 누구보다 잘 아는 박학다식 감자", type: "searching" },
          { text: "세상에 없던 나만의 무기를 만들어낸 반짝이는 감자", type: "creative" },
          { text: "어떤 자리든 믿고 맡길 수 있는 프로페셔널한 감자", type: "dependable" }
        ]
      }
    ];

    const MINI_POTATO_SVG = `
      <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 100 100" aria-hidden="true">
        <path d="M48 32 C66 32 82 48 84 65 C85 78 74 88 52 88 C30 88 17 83 17 67 C17 48 30 32 48 32 Z" fill="#CFA75C" stroke="#3A2A20" stroke-width="5" stroke-linejoin="round"/>
        <ellipse cx="73" cy="69" rx="3.2" ry="4.5" transform="rotate(28 73 69)" fill="#3A2A20"/>
        <ellipse cx="64" cy="77" rx="2.6" ry="3.8" transform="rotate(38 64 77)" fill="#3A2A20"/>
        <path d="M50 32 C50 25 50 22 50 18" stroke="#628E4C" stroke-width="3.5" stroke-linecap="round" fill="none"/>
        <path d="M50 19 C44 11 33 10 32 17 C31 23 42 24 50 19 Z" fill="#C6EA9F" stroke="#628E4C" stroke-width="2.8" stroke-linejoin="round"/>
        <path d="M50 19 C56 11 67 10 68 17 C69 23 58 24 50 19 Z" fill="#C6EA9F" stroke="#628E4C" stroke-width="2.8" stroke-linejoin="round"/>
      </svg>`;

    let stage = "intro";
    let qIndex = 0;
    let answers = Array(QUESTIONS.length).fill(null);
    let resultType = null;
    let spotlightIdx = 0;
    let spotlightTimer = null;

    const app = document.getElementById("app");
    const toast = document.getElementById("toast");
    const dexModal = document.getElementById("dex-modal");
    const dexCard = document.getElementById("dex-card");

    function imgPath(file) { return `${IMAGE_BASE}/${file}`; }

    function parseResultFromUrl() {
      const m = location.hash.replace(/^#/, "").match(/^(?:quiz\/)?result=([a-z]+)$/i);
      if (m && RESULTS[m[1].toLowerCase()]) return m[1].toLowerCase();
      const q = new URLSearchParams(location.search).get("result");
      if (q && RESULTS[q.toLowerCase()]) return q.toLowerCase();
      return null;
    }

    function computeWinner() {
      const scores = Object.fromEntries(ORDER.map(k => [k, 0]));
      const lastIdx = Object.fromEntries(ORDER.map(k => [k, -1]));
      answers.forEach((t, i) => { if (t) { scores[t] += 2; lastIdx[t] = i; } });
      let best = ORDER[0], max = -1, bestLast = -1;
      for (const t of ORDER) {
        if (scores[t] > max || (scores[t] === max && lastIdx[t] > bestLast)) {
          max = scores[t]; bestLast = lastIdx[t]; best = t;
        }
      }
      return best;
    }

    function openDex() {
      dexCard.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid rgba(58,42,32,.15);padding-bottom:14px;">
          <div>
            <div style="font-size:13px;color:var(--green);">춘천 캠퍼스 감자 도감</div>
            <h2 style="font-size:28px;margin-top:2px;">5종 감자 도감</h2>
          </div>
          <button type="button" id="dex-close" style="width:38px;height:38px;border-radius:12px;border:2px solid rgba(58,42,32,.25);background:var(--bg);font-size:18px;">✕</button>
        </div>
        ${ORDER.map(id => {
          const p = RESULTS[id];
          const mine = resultType === id;
          return `
            <div class="dex-item ${mine ? "mine" : ""}">
              <div class="dex-img" style="background:${p.stageBg};"><img src="${imgPath(p.file)}" alt="${p.name}" /></div>
              <div>
                <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                  <strong class="font-display" style="font-size:20px;">${p.name}</strong>
                  ${mine ? `<span style="background:var(--green);color:#fff;font-size:12px;padding:2px 8px;border-radius:999px;">내 유형</span>` : ""}
                </div>
                <div style="font-size:15px;color:var(--body);margin-top:4px;">${p.oneLiner}</div>
                <div style="font-size:13px;color:var(--muted);margin-top:3px;">환상의 팀플 파트너: ${p.partnerName}</div>
              </div>
            </div>`;
        }).join("")}
      `;
      dexModal.classList.add("open");
      document.getElementById("dex-close").onclick = () => dexModal.classList.remove("open");
    }

    function showToast() {
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2300);
    }

    function render() {
      clearInterval(spotlightTimer);
      window.scrollTo({ top: 0, behavior: "auto" });

      if (stage === "intro") {
        app.innerHTML = `
          <section class="card step-in" style="text-align:center;">
            <span class="pill">감자 키우기 미니 테스트 · 8문항</span>
            <h1 style="font-size:44px;margin-top:12px;">나는 어떤 감자일까?</h1>
            <p style="font-size:18px;color:var(--body);margin:8px 0 0;">춘천 캠퍼스 생활로 알아보는 나의 감자 유형 테스트</p>
            <div class="intro-preview">
              <div class="intro-grid" id="intro-grid">
                ${ORDER.map((id, i) => {
                  const p = RESULTS[id];
                  return `
                    <div class="intro-item">
                      <div class="intro-thumb ${i === spotlightIdx ? "active" : ""}" style="animation-delay:${i * 220}ms;">
                        <img src="${imgPath(p.file)}" alt="${p.name}" />
                      </div>
                      <span class="intro-label ${i === spotlightIdx ? "active" : ""}">${p.name.replace(" 감자", "")}</span>
                    </div>`;
                }).join("")}
              </div>
              <p style="font-size:14px;color:var(--muted);margin:0;">차분 · 활발 · 탐구 · 창의 · 든든 중 나는 어떤 캠퍼스 감자일까요?</p>
            </div>
            <button type="button" class="btn-primary" id="btn-start" style="max-width:280px;">내 감자 캐러 가기</button>
            <div style="margin-top:14px;">
              <button type="button" id="btn-intro-dex" style="background:none;border:none;color:var(--green);font-family:var(--font-display);font-size:16px;text-decoration:underline;">5종 감자 먼저 구경하기</button>
            </div>
          </section>`;
        document.getElementById("btn-start").onclick = () => {
          answers = Array(QUESTIONS.length).fill(null);
          qIndex = 0; resultType = null; stage = "play";
          history.replaceState(null, "", "#quiz");
          render();
        };
        document.getElementById("btn-intro-dex").onclick = openDex;
        spotlightTimer = setInterval(() => {
          spotlightIdx = (spotlightIdx + 1) % ORDER.length;
          const items = document.querySelectorAll("#intro-grid .intro-item");
          items.forEach((el, i) => {
            el.querySelector(".intro-thumb").classList.toggle("active", i === spotlightIdx);
            el.querySelector(".intro-label").classList.toggle("active", i === spotlightIdx);
          });
        }, 1800);
        return;
      }

      if (stage === "play") {
        const q = QUESTIONS[qIndex];
        const pct = Math.round(((qIndex + 1) / QUESTIONS.length) * 100);
        const ratio = qIndex / (QUESTIONS.length - 1);
        app.innerHTML = `
          <div class="progress-card">
            <div class="progress-head">
              <button type="button" id="btn-prev" style="padding:6px 12px;border-radius:10px;background:#faf6ec;border:1px solid rgba(58,42,32,.25);font-family:var(--font-display);font-size:14px;">← 이전</button>
              <span class="font-display" style="color:var(--green);font-size:16px;">${qIndex + 1} / ${QUESTIONS.length}</span>
            </div>
            <div class="track-wrap">
              <div class="track-potato" style="left:calc(16px + (100% - 32px) * ${ratio});">${MINI_POTATO_SVG}</div>
              <div class="track-bar"><div class="track-fill" style="width:${pct}%;"></div></div>
              <div class="track-dots">${QUESTIONS.map((_, i) => `<span class="track-dot ${i <= qIndex ? "done" : ""}"></span>`).join("")}</div>
            </div>
          </div>
          <section class="card step-in">
            <div class="font-display" style="color:var(--green);font-size:16px;margin-bottom:6px;">Q${q.id}.</div>
            <h2 style="font-size:28px;line-height:1.35;">${q.question}</h2>
            <div class="choice-list">
              ${q.choices.map((c, idx) => `
                <button type="button" class="choice-btn ${answers[qIndex] === c.type ? "picked" : ""}" data-type="${c.type}">
                  <span class="choice-num">${idx + 1}</span>
                  <span>${c.text}</span>
                </button>`).join("")}
            </div>
          </section>`;
        document.getElementById("btn-prev").onclick = () => {
          if (qIndex === 0) stage = "intro"; else qIndex -= 1;
          render();
        };
        document.querySelectorAll(".choice-btn").forEach((btn) => {
          btn.onclick = () => {
            btn.classList.add("flash");
            answers[qIndex] = btn.dataset.type;
            setTimeout(() => {
              if (qIndex < QUESTIONS.length - 1) {
                qIndex += 1; render();
              } else {
                const winner = computeWinner();
                stage = "loading"; render();
                setTimeout(() => {
                  resultType = winner; stage = "result";
                  history.replaceState(null, "", `#quiz/result=${winner}`);
                  render();
                }, 1200);
              }
            }, 170);
          };
        });
        return;
      }

      if (stage === "loading") {
        app.innerHTML = `
          <section class="card step-in" style="text-align:center;padding:56px 24px;">
            <div style="width:140px;height:140px;margin:0 auto 20px;border-radius:50%;background:#eef6e5;border:2px solid rgba(58,42,32,.2);display:flex;align-items:center;justify-content:center;">
              <img src="${imgPath("searching%20potato.png")}" alt="감자 캐는 중" class="wobble" style="width:96px;height:96px;object-fit:contain;" />
            </div>
            <h2 style="font-size:28px;">춘천 감자밭에서 당신을 캐는 중...</h2>
            <p style="color:var(--muted);margin-top:8px;">8가지 답변을 모아 딱 맞는 감자를 찾고 있어요</p>
          </section>`;
        return;
      }

      const res = RESULTS[resultType];
      const partner = RESULTS[res.partnerId];
      app.innerHTML = `
        <article class="card">
          <div style="text-align:center;">
            <span class="pill" style="background:${res.badgeBg};">나의 캠퍼스 감자 유형</span>
            <div class="result-medallion" style="background:${res.stageBg};">
              <img src="${imgPath(res.file)}" alt="${res.name}" />
            </div>
            <h1 style="font-size:38px;">${res.name}</h1>
            <p style="font-size:18px;color:var(--body);margin:8px 0 0;">${res.oneLiner}</p>
          </div>

          <div class="traits-box">
            <h2 style="font-size:22px;">캠퍼스 특징 3가지</h2>
            <ul class="traits-list">
              ${res.traits.map((t, i) => `<li><span class="font-display" style="color:var(--green);">${CIRCLED[i]}</span><span>${t}</span></li>`).join("")}
            </ul>
          </div>

          <div class="partner-box">
            <div>
              <div style="font-size:13px;color:var(--green);">환상의 팀플 파트너</div>
              <div class="font-display" style="font-size:24px;margin:2px 0;">${res.partnerName}</div>
              <div style="font-size:14px;color:var(--muted);">${partner.oneLiner}</div>
            </div>
            <div class="partner-thumb" style="background:${partner.stageBg};">
              <img src="${imgPath(partner.file)}" alt="${partner.name}" />
            </div>
          </div>

          <a class="btn-primary" href="${APP_LIVE_URL}" target="_blank" rel="noopener noreferrer">감자 키우기 앱에서 내 기회 찾기 ↗</a>
          <div class="grid-2">
            <button type="button" class="btn-secondary" id="btn-copy">결과 링크 복사</button>
            <button type="button" class="btn-secondary" id="btn-dex">5종 감자 도감 보기</button>
          </div>
          <div class="grid-2-always">
            <button type="button" class="btn-subtle" id="btn-retry">다시 하기</button>
            <button type="button" class="btn-subtle" id="btn-home">처음으로</button>
          </div>
        </article>`;

      document.getElementById("btn-copy").onclick = async () => {
        const url = `${location.origin}${location.pathname}#quiz/result=${resultType}`;
        try { await navigator.clipboard.writeText(url); } catch {}
        showToast();
      };
      document.getElementById("btn-dex").onclick = openDex;
      document.getElementById("btn-retry").onclick = () => {
        answers = Array(QUESTIONS.length).fill(null);
        qIndex = 0; resultType = null; stage = "play";
        history.replaceState(null, "", "#quiz");
        render();
      };
      document.getElementById("btn-home").onclick = () => {
        resultType = null; stage = "intro";
        history.replaceState(null, "", "#quiz");
        render();
      };
    }

    document.getElementById("btn-top-home").onclick = () => {
      resultType = null; stage = "intro";
      history.replaceState(null, "", "#quiz");
      render();
    };
    dexModal.onclick = (e) => { if (e.target === dexModal) dexModal.classList.remove("open"); };
    window.addEventListener("keydown", (e) => { if (e.key === "Escape") dexModal.classList.remove("open"); });

    const initial = parseResultFromUrl();
    if (initial) { resultType = initial; stage = "result"; }
    render();
  </script>
</body>
</html>
