<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>말랑 감자</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap" />
<!--
  말랑 감자: 감자 키우기 소개 홈페이지에 붙이는 "화면 속 말랑이".
  꾹 누르면 납작해지고, 끌면 늘어나고, 놓으면 띠용 하고 돌아온다. 누를수록 볼이 빨개지고 한마디씩 한다.

  홈페이지에 넣는 법 (둘 중 하나)
  1) 이 파일을 그대로 올리고 iframe으로:
     <iframe src="gamja-squishy.html" title="말랑 감자" style="width:100%;height:560px;border:0"></iframe>
  2) 아래 <style id="gamja-squishy-style">, <section class="gsq">…</section>, <script id="gamja-squishy-script"> 세 덩어리를
     홈페이지 HTML에 그대로 복사. 클래스 이름이 모두 gsq- 로 시작해서 다른 스타일과 섞이지 않는다.
  외부 라이브러리 없음 (글꼴 Jua만 Google Fonts에서 받음, 없으면 기본 글꼴).
-->
<style id="gamja-squishy-style">
.gsq { --gsq-ink: #2e1d14; --gsq-ink-2: #7a6553; --gsq-paper: #f6eedd; --gsq-cut: #fffdf7; --gsq-blush: 0;
  position: relative; display: grid; justify-items: center; gap: 6px; padding: 28px 16px 22px; border-radius: 28px;
  background: radial-gradient(120% 90% at 50% 0%, #fbf6ea 0%, var(--gsq-paper) 70%); color: var(--gsq-ink);
  font-family: 'Jua', 'Pretendard Variable', 'Apple SD Gothic Neo', system-ui, sans-serif; overflow: hidden; user-select: none; -webkit-user-select: none; }
.gsq-title { margin: 0; font-size: clamp(24px, 5vw, 32px); font-weight: 400; line-height: 1.2; }
.gsq-lead { margin: 0; font-size: 16px; color: var(--gsq-ink-2); }
.gsq-stage { position: relative; width: min(320px, 78vw); aspect-ratio: 300 / 360; margin-top: 4px; }
.gsq-say { position: absolute; left: 50%; top: 0; z-index: 2; translate: -50% 0; padding: 9px 18px 10px; border: 3px solid var(--gsq-ink); border-radius: 18px;
  background: var(--gsq-cut); font-size: 19px; line-height: 1.2; white-space: nowrap; opacity: 0; scale: 0.6; transition: opacity 0.18s, scale 0.32s cubic-bezier(0.3, 1.6, 0.5, 1); pointer-events: none; }
.gsq-say::after { content: ''; position: absolute; left: 50%; bottom: -10px; width: 14px; height: 14px; translate: -50% 0; rotate: 45deg; background: var(--gsq-cut);
  border-right: 3px solid var(--gsq-ink); border-bottom: 3px solid var(--gsq-ink); }
.gsq-say.on { opacity: 1; scale: 1; }
.gsq-btn { position: absolute; inset: 14% 0 0; display: block; width: 100%; padding: 0; border: 0; background: none; cursor: grab; touch-action: none; -webkit-tap-highlight-color: transparent; }
.gsq-btn:active { cursor: grabbing; }
.gsq-btn:focus-visible { outline: 3px dashed var(--gsq-ink-2); outline-offset: 6px; border-radius: 40%; }
.gsq-btn svg { display: block; width: 100%; height: 100%; overflow: visible; }
.gsq-shadow { transform-box: fill-box; transform-origin: center; }
.gsq-pop { position: absolute; z-index: 3; font-size: 22px; color: var(--gsq-ink); pointer-events: none; opacity: 0; translate: -50% -50%;
  animation: gsq-pop 0.9s cubic-bezier(0.2, 0.8, 0.3, 1) forwards; text-shadow: 0 2px 0 var(--gsq-cut); }
@keyframes gsq-pop { 0% { opacity: 0; scale: 0.5; } 20% { opacity: 1; scale: 1.1; } 100% { opacity: 0; scale: 1; translate: -50% -170%; } }
@media (prefers-reduced-motion: reduce) { .gsq-pop { animation-duration: 0.01s; } .gsq-say { transition: none; } }
</style>
</head>
<body style="margin:0;min-height:100vh;display:grid;place-items:center;background:#efe5d0;padding:16px;box-sizing:border-box">

<section class="gsq" aria-label="말랑 감자 장난감" style="width:min(520px,100%)">
  <h2 class="gsq-title">말랑 감자, 만져 보고 가세요</h2>
  <p class="gsq-lead">꾹 누르고, 쭉 늘리고, 놓아 보세요</p>
  <div class="gsq-stage">
    <p class="gsq-say" aria-live="polite"></p>
    <button type="button" class="gsq-btn" aria-label="말랑 감자 누르기 (스페이스나 엔터로도 누를 수 있어요)">
      <svg viewBox="0 0 300 348" aria-hidden="true">
        <defs>
          <radialGradient id="gsq-skin" cx="42%" cy="34%" r="75%">
            <stop offset="0" stop-color="#ecc68d" />
            <stop offset="0.7" stop-color="#ddb072" />
            <stop offset="1" stop-color="#cf9c5e" />
          </radialGradient>
        </defs>
        <ellipse class="gsq-shadow" cx="150" cy="334" rx="96" ry="10" fill="#3a2a20" opacity="0.14" />
        <g class="gsq-body">
          <!-- 머리 위 털 두 가닥 -->
          <g class="gsq-hair" stroke="#e0b27a" stroke-width="11" stroke-linecap="round">
            <path d="M56 112 L70 128" />
            <path d="M78 96 L86 114" />
          </g>
          <!-- 팔·발 -->
          <g stroke="#2e1d14" stroke-width="10" stroke-linecap="round">
            <path class="gsq-arm-l" d="M26 262 L42 262" />
            <path class="gsq-arm-r" d="M260 262 L276 262" />
            <path d="M104 312 L100 330" />
            <path d="M196 312 L200 330" />
          </g>
          <!-- 몸 -->
          <path class="gsq-skin" d="M150 128 C 222 128, 264 190, 264 254 C 264 300, 216 320, 150 320 C 84 320, 36 300, 36 254 C 36 190, 78 128, 150 128 Z"
            fill="url(#gsq-skin)" stroke="#2e1d14" stroke-width="9" stroke-linejoin="round" />
          <path d="M92 168 C 104 152, 124 144, 142 142" fill="none" stroke="#fff6e2" stroke-width="7" stroke-linecap="round" opacity="0.55" />
          <!-- 얼굴 (몸보다 살짝 늦게 따라와서 출렁인다) -->
          <g class="gsq-face">
            <ellipse class="gsq-cheek" cx="94" cy="256" rx="22" ry="13" fill="#e2785e" />
            <ellipse class="gsq-cheek" cx="204" cy="256" rx="22" ry="13" fill="#e2785e" />
            <g class="gsq-eyes-open" fill="#2e1d14">
              <ellipse cx="114" cy="238" rx="7.5" ry="10" />
              <ellipse cx="184" cy="238" rx="7.5" ry="10" />
            </g>
            <g class="gsq-eyes-shut" fill="none" stroke="#2e1d14" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" style="display:none">
              <path d="M104 230 L118 238 L104 246" />
              <path d="M194 230 L180 238 L194 246" />
            </g>
            <g class="gsq-eyes-blink" fill="none" stroke="#2e1d14" stroke-width="5" stroke-linecap="round" style="display:none">
              <path d="M106 239 Q114 245 122 239" />
              <path d="M176 239 Q184 245 192 239" />
            </g>
            <path class="gsq-mouth" d="M138 254 Q149 263 160 254" fill="none" stroke="#2e1d14" stroke-width="5.5" stroke-linecap="round" />
          </g>
          <!-- 감자 점 -->
          <ellipse cx="232" cy="262" rx="6.5" ry="9.5" fill="#6e4127" transform="rotate(18 232 262)" />
          <ellipse cx="214" cy="290" rx="6" ry="8.5" fill="#6e4127" transform="rotate(28 214 290)" />
        </g>
      </svg>
    </button>
  </div>
</section>

<script id="gamja-squishy-script">
(() => {
  for (const root of document.querySelectorAll('.gsq')) {
    if (root.dataset.ready) continue;
    root.dataset.ready = '1';
    const btn = root.querySelector('.gsq-btn');
    const body = root.querySelector('.gsq-body');
    const face = root.querySelector('.gsq-face');
    const shadow = root.querySelector('.gsq-shadow');
    const cheeks = root.querySelectorAll('.gsq-cheek');
    const open = root.querySelector('.gsq-eyes-open');
    const shut = root.querySelector('.gsq-eyes-shut');
    const blinkG = root.querySelector('.gsq-eyes-blink');
    const mouth = root.querySelector('.gsq-mouth');
    const say = root.querySelector('.gsq-say');
    const stage = root.querySelector('.gsq-stage');
    const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;

    const LINES = ['으앗, 말랑!', '헤헤 간지러워', '나 말랑하지?', '한 번 더!', '진로 걱정은 나한테 꾹!', '스트레스 다 가져갈게', '쫀득쫀득', '춘천 감자는 원래 말랑해'];
    const LOTS = { 10: '그만 만져~ 녹는다고!', 20: '너 진짜 스트레스 많구나…', 30: '이 정도면 우리 찐친이야', 50: '말랑 장인 인정!' };
    const HOLD = ['으으읍…', '납작해진다…', '숨 막혀!'];

    // 스프링: 값마다 [지금, 속도, 목표]
    // sx·sy: 누를 때 납작해지는 정도, px·py: 끌어당긴 방향과 거리(그림 좌표), fx·fy: 얼굴이 늦게 따라오는 정도
    const S = { sx: [1, 0, 1], sy: [1, 0, 1], px: [0, 0, 0], py: [0, 0, 0], fx: [0, 0, 0], fy: [0, 0, 0] };
    const STIFF = calm ? 300 : 210;
    const DAMP = calm ? 30 : 11;
    let pressed = false;
    let pressAt = 0;
    let start = null;
    let count = 0;
    let blush = 0;
    let sayTimer = 0;
    let lastHold = -1;

    const speak = (text, ms = 1500) => {
      say.textContent = text;
      say.classList.add('on');
      clearTimeout(sayTimer);
      sayTimer = setTimeout(() => say.classList.remove('on'), ms);
    };
    const pop = (text, x, y) => {
      if (calm) return;
      const el = document.createElement('span');
      el.className = 'gsq-pop';
      el.textContent = text;
      el.style.left = `${x}%`;
      el.style.top = `${y}%`;
      stage.appendChild(el);
      setTimeout(() => el.remove(), 950);
    };
    const face_ = (squeeze) => {
      open.style.display = squeeze ? 'none' : '';
      shut.style.display = squeeze ? '' : 'none';
      blinkG.style.display = 'none';
      mouth.setAttribute('d', squeeze ? 'M140 258 Q149 250 158 258 Q149 266 140 258 Z' : 'M138 254 Q149 263 160 254');
      mouth.setAttribute('fill', squeeze ? '#7a2f22' : 'none');
    };

    const svg = btn.querySelector('svg');
    const toSvg = (e) => {
      const pt = svg.createSVGPoint();
      pt.x = e.clientX;
      pt.y = e.clientY;
      const q = pt.matrixTransform(svg.getScreenCTM().inverse());
      return { x: q.x, y: q.y };
    };
    const down = (e) => {
      pressed = true;
      pressAt = performance.now();
      lastHold = -1;
      // 잡은 곳(그림 좌표). 끌면 이 점이 마우스·손가락을 따라간다
      start = e && 'clientX' in e ? toSvg(e) : null;
      S.sx[2] = 1.16;
      S.sy[2] = 0.8;
      S.sy[1] -= 2.5;
      face_(true);
      pop('말랑', 30 + Math.random() * 40, 38 + Math.random() * 10);
    };
    const move = (e) => {
      if (!pressed || !start) return;
      // 잡은 곳이 마우스(손가락)를 따라간다 = 끄는 쪽으로 쭉 늘어난다
      const q = toSvg(e);
      let dx = q.x - start.x;
      let dy = q.y - start.y;
      if (dy > 0) dy *= 0.5; // 아래는 바닥이라 조금만
      const MAX = 150;
      const len = Math.hypot(dx, dy);
      if (len > MAX) { dx *= MAX / len; dy *= MAX / len; }
      S.px[2] = dx;
      S.py[2] = dy;
      // 당기기 시작하면 눌린 납작함은 풀린다
      const f = Math.min(1, len / 40);
      S.sy[2] = 0.8 + 0.2 * f;
      S.sx[2] = 1.16 - 0.16 * f;
    };
    const up = () => {
      if (!pressed) return;
      pressed = false;
      count += 1;
      blush = Math.min(1, blush + 0.16);
      // 놓으면 띠용: 목표는 제자리, 반대 방향으로 힘을 준다
      S.sy[1] += (1 - S.sy[0]) * 9;
      S.sx[1] += (1 - S.sx[0]) * 9;
      S.sx[2] = 1;
      S.sy[2] = 1;
      S.px[2] = 0;
      S.py[2] = 0;
      S.fy[1] -= 140;
      face_(false);
      pop(['뽀잉!', '띠용!', '말랑!'][count % 3], 50 + (Math.random() - 0.5) * 50, 30);
      speak(LOTS[count] ?? LINES[(count - 1) % LINES.length], LOTS[count] ? 2200 : 1400);
    };

    // 끄는 동안은 창 전체에서 마우스를 따라간다 (감자 밖으로 나가도, 포인터 캡처가 풀려도 끊기지 않게)
    btn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      down(e);
      const onMove = (ev) => move(ev);
      const onUp = () => {
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onUp);
        window.removeEventListener('pointercancel', onUp);
        up();
      };
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
      window.addEventListener('pointercancel', onUp);
    });
    btn.addEventListener('keydown', (e) => {
      if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); down(null); }
    });
    btn.addEventListener('keyup', (e) => {
      if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); up(); }
    });
    btn.addEventListener('click', (e) => e.preventDefault());

    let prev = performance.now();
    const tick = (now) => {
      const dt = Math.min(0.033, (now - prev) / 1000);
      prev = now;
      // 오래 누르면 조금씩 더 납작해진다
      if (pressed) {
        const held = (now - pressAt) / 1000;
        if (Math.hypot(S.px[2], S.py[2]) < 20) {
          const deep = Math.min(0.14, held * 0.07);
          if (S.sy[2] <= 0.82) { S.sy[2] = 0.8 - deep; S.sx[2] = 1.16 + deep * 0.9; }
        }
        const step = Math.floor(held / 1.2) - 1;
        if (step >= 0 && step !== lastHold && step < HOLD.length) { lastHold = step; speak(HOLD[step], 1300); }
      } else {
        blush = Math.max(0, blush - dt * 0.05);
      }
      // 얼굴은 몸의 기울기·출렁임을 조금 늦게 따라간다
      S.fx[2] = S.px[0] * 0.12;
      S.fy[2] = (1 - S.sy[0]) * 30 + S.py[0] * 0.12;
      for (const key in S) {
        const v = S[key];
        const stiff = key[0] === 'f' ? STIFF * 0.6 : STIFF;
        // 늘어난 건 놓으면 반대쪽으로 튕겨 늘어나지 않게 거의 바로 멈춘다 (출렁임은 납작·통통으로만)
        const damp = key[0] === 'p' ? 2 * Math.sqrt(stiff) * 0.9 : DAMP;
        const acc = stiff * (v[2] - v[0]) - damp * v[1];
        v[1] += acc * dt;
        v[0] += v[1] * dt;
      }
      const breathe = pressed || calm ? 0 : Math.sin(now / 700) * 0.012;
      const sx = S.sx[0] - breathe * 0.6;
      const sy = S.sy[0] + breathe;
      // 발바닥(아래 가운데, 150 330)을 붙인 채 찌그러뜨린다
      const squash = `translate(150 330) scale(${sx} ${sy}) translate(-150 -330)`;
      // 끄는 쪽으로 늘이기: 발은 바닥(150, 330)에 붙인 채, 머리 꼭대기가 끈 만큼(d) 따라간다.
      // 위로 끌면 길쭉(h↑), 옆으로 끌면 그쪽으로 휘어 늘어나고, 길어진 만큼 옆으로 홀쭉해진다
      const len = Math.hypot(S.px[0], S.py[0]);
      let pull = '';
      let wide = 1;
      if (len > 0.5) {
        const H = 202; // 발바닥(330)에서 머리 꼭대기(128)까지
        const h = Math.max(0.65, Math.min(1.9, 1 - S.py[0] / H));
        const lean = (S.px[0] / H) * 0.7; // 옆으로는 조금 덜 (상자 밖으로 넘어가지 않게)
        const reach = Math.hypot(lean, h); // 발→머리가 얼마나 길어졌나
        const thin = 1 / Math.sqrt(Math.max(0.65, reach));
        // 발 기준 좌표에서 x' = thin·x − lean·y', y' = h·y  (y는 위가 음수)
        pull = `translate(150 330) matrix(${thin} 0 ${-lean} ${h} 0 0) translate(-150 -330) `;
        wide = thin;
      }
      body.setAttribute('transform', pull + squash);
      face.setAttribute('transform', `translate(${S.fx[0]} ${S.fy[0] * 0.3})`);
      shadow.setAttribute('transform', `scale(${sx * 1.02 * wide} 1)`);
      const b = 0.32 + blush * 0.55 + (pressed ? 0.15 : 0);
      cheeks.forEach((c) => c.setAttribute('opacity', b.toFixed(3)));
      // 가끔 깜빡
      if (!pressed) {
        const blink = (now % 3900) < 120;
        open.style.display = blink ? 'none' : '';
        blinkG.style.display = blink ? '' : 'none';
        shut.style.display = 'none';
      }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
